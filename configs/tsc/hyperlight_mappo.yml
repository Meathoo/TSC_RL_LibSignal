includes:
  - configs/tsc/hyperlight_ppo.yml


model:
  name: hyperlight_mappo
  centralized_critic: True
  # concat is closest to the public HyperMARL MAPPO implementation.
  # Use pooled only as a memory fallback on very large TSC maps.
  centralized_critic_mode: concat
  value_hidden: [64, 64]


trainer:
  buffer_size: 1000
